<div class="course-card max-w-[20em]">
    <div class="course-title">{{ course.name }}</div>
    <img width="300" [alt]="course.name" [src]="course.imageUrl">
    <div class="course-description">{{ course.description }}</div>
    <p>Price: {{ course.price }} €</p>
    <button class="bg-sky-400 text-white px-2.5 py-1 rounded-md hover:bg-sky-600 hover:cursor-pointer"
        (click)="onButtonClicked(course)">Buy</button>
</div>
